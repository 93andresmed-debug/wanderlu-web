<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wanderlu - Registro de Jugador</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top, #1e293b, #090d16); color: #f8fafc; padding: 20px;
    }
    .card {
      width: 100%; max-width: 420px; background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 16px;
      padding: 32px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    h1 { margin: 0 0 6px; font-size: 28px; color: #38bdf8; text-align: center; }
    p.sub { margin: 0 0 24px; font-size: 14px; color: #94a3b8; text-align: center; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5e1; }
    input, select {
      width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 10px;
      border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px;
    }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #38bdf8, #0284c7); color: #090d16;
      font-weight: 700; font-size: 16px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 14px; display: none;
    }
    .ok { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #6ee7b7; }
    .err { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>WANDERLU</h1>
    <p class="sub">Crea tu cuenta para guardar tu avatar, ropa y monedas</p>

    <form id="formRegistro">
      <label for="nickname">Nickname en el juego</label>
      <input id="nickname" type="text" placeholder="Ej: AndresMed" minlength="3" maxlength="16" required />

      <label for="genero">Avatar inicial</label>
      <select id="genero">
        <option value="Hombre">Hombre</option>
        <option value="Mujer">Mujer</option>
      </select>

      <label for="correo">Correo electrónico</label>
      <input id="correo" type="email" placeholder="tucorreo@ejemplo.com" required />

      <label for="password">Contraseña (mínimo 6 caracteres)</label>
      <input id="password" type="password" placeholder="••••••••" minlength="6" required />

      <button id="btnEnviar" type="submit">Registrarme</button>
    </form>

    <div id="mensaje" class="msg"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://bfqxybdtqdhtefkmqykn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nDXX0rypt-jyIvHz08zjdA_6mocMwi9";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("formRegistro");
    const msg = document.getElementById("mensaje");
    const btn = document.getElementById("btnEnviar");

    function mostrarMensaje(texto, esError) {
      msg.textContent = texto;
      msg.className = "msg " + (esError ? "err" : "ok");
      msg.style.display = "block";
    }

    if (window.location.hash.includes("access_token") || window.location.search.includes("code=")) {
      mostrarMensaje("¡Correo verificado con éxito! Ya puedes volver a Wanderlu e iniciar sesión con tu correo y contraseña.", false);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Registrando...";

      const nickname = document.getElementById("nickname").value.trim();
      const genero = document.getElementById("genero").value;
      const email = document.getElementById("correo").value.trim();
      const password = document.getElementById("password").value;

      const { data: existe } = await sb
        .from("perfiles")
        .select("nickname")
        .ilike("nickname", nickname)
        .maybeSingle();

      if (existe) {
        mostrarMensaje("Ese nickname ya está en uso. Elige otro.", true);
        btn.disabled = false;
        btn.textContent = "Registrarme";
        return;
      }

      const { error } = await sb.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: window.location.origin,
          data: { nickname, genero }
        }
      });

      if (error) {
        mostrarMensaje("Error al registrar: " + error.message, true);
      } else {
        form.reset();
        mostrarMensaje("¡Registro enviado! Revisa tu correo y haz clic en el botón de confirmación para activar tu cuenta.", false);
      }

      btn.disabled = false;
      btn.textContent = "Registrarme";
    });
  </script>
</body>
</html>
